# 最外层反向代理（统一入口）
#
# 职责：
#   1. 把 / 交给前端容器，/api 与 /uploads 转给后端容器（同域，因此不需要 CORS）
#   2. 下发安全响应头（HTML 的 CSP 在这里配置；API 的由后端 helmet 负责）
#   3. 限制请求体大小、隐藏 nginx 版本、开启压缩
#
# 生产上请在这一层加上 HTTPS（证书与 443 监听），见 docs/GO-LIVE-CHECKLIST.md

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

upstream backend_upstream {
    server backend:3000;
    keepalive 16;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    # 默认限制请求体；公开投稿每次最多 3 张、每张 5MB。
    client_max_body_size 1m;

    # ---------- 安全响应头 ----------
    # 注意：这些是给 HTML 用的；后端 API 自带 helmet 的头，不要重复下发
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---------- 压缩 ----------
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 接口 ----------
    location = /robots.txt {
        proxy_pass http://backend_upstream/api/public/robots.txt;
    }

    location = /sitemap.xml {
        proxy_pass http://backend_upstream/api/public/sitemap.xml;
    }

    location /api/ {
        client_max_body_size 16m;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 后端 helmet 也会发这几个头，去掉避免出现两份（值还不一致）
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # ---------- 上传的图片 ----------
    # 由后端静态托管（文件已重编码为 webp），缓存由 express.static 的 max-age 控制
    location /uploads/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # 管理员登录页公开，其余后台页面在服务端验证会话后才返回 SPA。
    location = /admin/login {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location = /_admin_session_check {
        internal;
        proxy_pass http://backend_upstream/api/admin/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    location ~ ^/admin(?:/|$) {
        auth_request /_admin_session_check;
        error_page 401 = @admin_login_redirect;
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location @admin_login_redirect {
        return 302 /admin/login;
    }

    # ---------- 前端 ----------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}
