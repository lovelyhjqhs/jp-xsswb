# 前端容器内的 nginx：只负责分发静态文件（对外暴露由最外层 nginx 负责）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的构建产物可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发布后能立刻拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由回退：/items/1 这类前端路由都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
