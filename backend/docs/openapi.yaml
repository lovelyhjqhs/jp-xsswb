  # ================= 后台：用户 =================
  /admin/users:
    get:
      tags: [后台-用户]
      summary: 用户列表
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, maximum: 100, default: 20 } }
        - { in: query, name: status, schema: { type: string, enum: [active, banned] } }
        - { in: query, name: keyword, schema: { type: string, maxLength: 50 }, description: 学号或姓名 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
