      tags: [后台-用户]
      summary: 重置密码
      description: |
        返回一次性临时密码（只显示这一次，库里只存哈希，审计日志不记录明文）。
        不能重置其他管理员的密码。
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
