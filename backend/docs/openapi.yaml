                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          studentNo: { type: string }
                          name: { type: string }
                          tempPassword: { type: string, description: 一次性临时密码 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/items:
    get:
      tags: [后台-用户]
      summary: 某个用户的发帖记录
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
