                            items: { $ref: '#/components/schemas/ItemSummary' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================= 后台：举报 =================
  /admin/reports:
    get:
      tags: [后台-举报]
      summary: 举报列表
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, maximum: 100, default: 20 } }
        - { in: query, name: status, schema: { type: string, enum: [pending, handled] } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/Report' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/{id}/handle:
    post:
      tags: [后台-举报]
      summary: 处理举报
      description: offline = 下架被举报帖子并把举报标记为已处理；ignore = 只标记举报。重复处理返回 409。
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [offline, ignore] }
                note: { type: string, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ================= 后台：分类 =================
  /admin/categories:
    get:
      tags: [后台-分类]
      summary: 分类列表（含停用项与帖子数）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [后台-分类]
      summary: 新建分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 30 }
                sortOrder: { type: integer, minimum: 0, default: 0 }
                enabled: { type: boolean, default: true }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/categories/{id}:
    patch:
      tags: [后台-分类]
      summary: 更新分类
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 30 }
                sortOrder: { type: integer, minimum: 0 }
                enabled: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

    delete:
      tags: [后台-分类]
      summary: 删除分类
      description: 分类下还有帖子时拒绝删除（409），提示先迁移。
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ================= 后台：学号名单 =================
  /admin/whitelist:
    get:
      tags: [后台-名单]
      summary: 名单列表
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, maximum: 100, default: 20 } }
        - { in: query, name: keyword, schema: { type: string, maxLength: 50 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                studentNo: { type: string }
                                name: { type: string }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/whitelist/preview:
    post:
      tags: [后台-名单]
      summary: 预览 CSV（不写库）
      description: |
        CSV 每行「学号,姓名」，可带表头。支持 UTF-8 与 GBK（Excel 默认导出）。
        每行会被标记为：`new` 可导入、`duplicate-in-file` 文件内重复、
        `duplicate-existing` 名单已存在、`invalid` 格式错误。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 解析完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rows:
                            type: array
                            items:
                              type: object
                              properties:
                                lineNo: { type: integer }
                                studentNo: { type: string }
                                name: { type: string }
                                status: { type: string, enum: [new, duplicate-in-file, duplicate-existing, invalid] }
                                reason: { type: string }
                          summary:
                            type: object
                            properties:
                              total: { type: integer }
                              importable: { type: integer }
                              duplicateInFile: { type: integer }
                              duplicateExisting: { type: integer }
                              invalid: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/whitelist/import:
    post:
      tags: [后台-名单]
      summary: 确认导入 CSV
      description: 服务端会重新解析与校验（不信任前端预览结果），重复项自动跳过。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 导入完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total: { type: integer }
                          imported: { type: integer }
                          skipped: { type: integer }
                          duplicateInFile: { type: integer }
                          duplicateExisting: { type: integer }
                          invalid: { type: integer }
                          invalidRows:
                            type: array
                            items:
                              type: object
                              properties:
                                lineNo: { type: integer }
                                studentNo: { type: string }
                                reason: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ================= 运维 =================
  /health:
    get:
      tags: [运维]
      summary: 健康检查
      description: 同时探一次数据库，`db=up` 表示连接正常。用于容器健康检查与监控探活。
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: ok }
                          db: { type: string, example: up }
                          uptime: { type: integer, example: 123 }
                          time: { type: string, format: date-time }
        '503':
          description: 数据库不可用

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Success:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 未登录或 token 失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 无权限（含账号被禁用、非管理员访问后台）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: 状态冲突或资源重复
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: 触发限流
      headers:
        Retry-After:
          schema: { type: integer }
          description: 建议等待秒数
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    Envelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: { nullable: true }

    ErrorEnvelope:
      type: object
      properties:
        code: { type: integer, example: 40001 }
        message: { type: string, example: 请求参数校验失败 }
        data:
          nullable: true
          description: 校验失败时为 `[{ field, message }]`

    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 12 }
        total: { type: integer, example: 37 }
        totalPages: { type: integer, example: 4 }

    UserPublic:
      type: object
      properties:
        id: { type: integer }
        studentNo: { type: string }
        name: { type: string }
        role: { type: string, enum: [student, admin] }
        status: { type: string, enum: [active, banned] }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }

    AdminUser:
      allOf:
        - $ref: '#/components/schemas/UserPublic'
        - type: object
          properties:
            _count:
              type: object
              properties:
                items: { type: integer }

    ItemSummary:
      type: object
      description: 列表项（无联系方式）
      properties:
        id: { type: integer }
        type: { type: string, enum: [lost, found] }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        happenedAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, open, resolved, rejected, offline] }
        viewCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        hasContact: { type: boolean }
        category:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        user:
          type: object
          description: 非本人时 name 已脱敏（王**）
          properties:
            id: { type: integer }
            name: { type: string, example: 王** }
        images:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              url: { type: string }
              sortOrder: { type: integer }

    ItemDetail:
      allOf:
        - $ref: '#/components/schemas/ItemSummary'
        - type: object
          description: 已登录时才有 contactType / contactValue；作者本人与管理员才有 rejectReason
          properties:
            contactType: { type: string, enum: [wechat, qq, phone, other] }
            contactValue: { type: string }
            rejectReason: { type: string, nullable: true }

    AdminItem:
      allOf:
        - $ref: '#/components/schemas/ItemDetail'
        - type: object
          properties:
            _count:
              type: object
              properties:
                reports: { type: integer }
            user:
              type: object
              properties:
                id: { type: integer }
                studentNo: { type: string }
                name: { type: string }
                status: { type: string }

    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        sortOrder: { type: integer }
        enabled: { type: boolean }

    AdminCategory:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            _count:
              type: object
              properties:
                items: { type: integer }

    Report:
      type: object
      properties:
        id: { type: integer }
        reason: { type: string }
        status: { type: string, enum: [pending, handled] }
        createdAt: { type: string, format: date-time }
        item:
          type: object
          properties:
            id: { type: integer }
            title: { type: string }
            status: { type: string }
            type: { type: string }
            user:
              type: object
              properties:
                id: { type: integer }
                studentNo: { type: string }
                name: { type: string }
        reporter:
          type: object
          properties:
            id: { type: integer }
            studentNo: { type: string }
            name: { type: string }
        handler:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }

    AuditLog:
      type: object
      properties:
        id: { type: integer }
        action: { type: string, example: item.offline }
        targetType: { type: string, example: item }
        targetId: { type: integer, nullable: true }
        detail:
          type: object
          nullable: true
          description: 结构化明细（前后状态、理由等）
        createdAt: { type: string, format: date-time }
        admin:
          type: object
          nullable: true
          description: 为 null 表示系统任务（如 90 天自动归档）
          properties:
            id: { type: integer }
            name: { type: string }
            studentNo: { type: string }

    Stats:
      type: object
      properties:
        totalItems: { type: integer }
        pendingItems: { type: integer }
        weeklyNew: { type: integer, description: 最近 7 天新增 }
        openItems: { type: integer }
        resolvedItems: { type: integer }
        resolvedRate: { type: number, example: 0.5, description: resolved / (open + resolved) }
        totalUsers: { type: integer }
        bannedUsers: { type: integer }
        pendingReports: { type: integer }
        trend:
          type: array
          description: 近 30 天每日发布量
          items:
            type: object
            properties:
              date: { type: string, example: '2026-10-23' }
              count: { type: integer }
